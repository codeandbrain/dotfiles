<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard - Login</title>
  <!-- Bootstrap 5 CSS CDN -->
  <link href="https://jsdelivr.net" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center min-vh-100">

  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-5 col-lg-4">
        <div class="card shadow border-0 rounded-3">
          <div class="card-body p-4 p-sm-5">
            <h3 class="card-title text-center mb-4 fw-bold text-primary">Admin Panel</h3>
            
            <form>
              <!-- Email Input -->
              <div class="form-floating mb-3">
                <input type="email" class="form-control" id="adminEmail" placeholder="name@example.com" required>
                <label for="adminEmail">Email address</label>
              </div>
              
              <!-- Password Input -->
              <div class="form-floating mb-3">
                <input type="password" class="form-control" id="adminPassword" placeholder="Password" required>
                <label for="adminPassword">Password</label>
              </div>

              <!-- Remember Me & Forgot Password -->
              <div class="d-flex justify-content-between align-items-center mb-3">
                <div class="form-check">
                  <input class="form-check-input" type="checkbox" id="rememberMe">
                  <label class="form-check-label text-muted small" for="rememberMe">Remember me</label>
                </div>
                <a href="#" class="text-decoration-none small text-muted">Forgot password?</a>
              </div>

              <!-- Submit Button -->
              <button class="btn btn-primary w-100 py-2 fw-semibold" type="submit">Sign In</button>
            </form>

          </div>
        </div>
      </div>
    </div>
  </div>

</body>
</html>
